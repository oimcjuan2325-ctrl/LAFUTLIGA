<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAFUTLIGA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h2>⚽ LAFUTLIGA</h2>
            <form id="login-form" onsubmit="iniciarSesion(event)">
                <input type="text" id="username" placeholder="Usuario" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit">Entrar</button>
            </form>
            <p id="error-msg" class="error hidden">Usuario o contraseña incorrectos</p>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="app-screen" class="app-container hidden">
        <header class="navbar">
            <h1>⚽ LAFUTLIGA</h1>
            <div class="user-info">
                <span>👤 Usuario: <strong id="user-display">Juan</strong></span>
                <button onclick="cerrarSesion()" class="btn-logout">Salir</button>
            </div>
        </header>

        <main class="content-area">
            <section class="section-card">
                <h2>📅 Resultados y Partidos de LaLiga</h2>
                <div class="jornada-selector">
                    <label for="select-jornada"><strong>Seleccionar Jornada:</strong> </label>
                    <select id="select-jornada" onchange="cargarPartidosJornada(this.value)">
                        <option value="1">Jornada 1</option>
                        <option value="2">Jornada 2</option>
                        <option value="3">Jornada 3</option>
                        <option value="4">Jornada 4</option>
                        <option value="5">Jornada 5</option>
                        <!-- Se irán añadiendo las 38 jornadas -->
                    </select>
                </div>
                <div id="partidos-container" class="partidos-list">
                    <!-- Aquí se cargan los partidos -->
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
